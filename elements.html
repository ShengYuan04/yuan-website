const list=document.getElementById("productList");
products.forEach(item=>{

row.innerHTML=`
<td><input type="checkbox" class="item-checkbox" data-id="${item.id}" data-name="${item.name}" data-price="${item.price}"></td>

list.appendChild(row);});
//圖片預覽
const preview=document.createElement("img");
preview.className="image-preview";
document.body.appendChild(preview);
document.addEventListener("mouseover",e=>{
if(e.target.classList.contains("product-name")){
preview.src=e.target.dataset.img;
preview.style.display="block";}});
document.addEventListener("mousemove",e=>{
if(preview.style.display=="block"){
preview.style.left=e.clientX+20+"px";
preview.style.top=e.clientY+20+"px";}});
document.addEventListener("mouseout",e=>{
if(e.target.classList.contains("product-name")){
preview.style.display="none";}});
const cartTableBody=document.querySelector("#cartTable tbody");
const totalPriceEl=document.getElementById("totalPrice");

function updateTotal(){
let total=0;
document.querySelectorAll(".subtotal").forEach(x=>{
total+=Number(x.innerText);
});
totalPriceEl.innerText=total+"萬";
}

document.addEventListener("change",function(e){

if(!e.target.classList.contains("item-checkbox")) return;

let box=e.target;
let id=box.dataset.id;
let name=box.dataset.name;
let price=Number(box.dataset.price);

if(box.checked){

let row=document.createElement("tr");
row.id="cart-"+id;

row.innerHTML=`
<td>${name}</td>
<td>${price}</td>
<td><input type="number" class="qty" value="1" min="1"></td>
<td class="subtotal">${price}</td>
<td><button class="remove-btn">刪除</button></td>
`;

cartTableBody.appendChild(row);

let qty=row.querySelector(".qty");

qty.addEventListener("input",()=>{
row.querySelector(".subtotal").innerText=price*qty.value;
updateTotal();
});

row.querySelector(".remove-btn").onclick=()=>{
row.remove();
box.checked=false;
updateTotal();
};

}else{

let row=document.getElementById("cart-"+id);
if(row) row.remove();

}

updateTotal();

});
